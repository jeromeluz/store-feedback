<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>區組回饋平台</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#19314c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#193c66;color:white;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;gap:12px}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:22px;margin:0 0 18px;box-shadow:0 4px 18px #1232}h2{margin-top:0}input,textarea,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #cdd7e4}input,textarea,select{display:block;width:100%;margin:7px 0 15px}textarea{min-height:90px}button{background:#225c99;color:white;border:0;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#e6edf5;color:#163a61}button.danger{background:#a42b39}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.muted{color:#64758a;font-size:14px}.error{color:#b3261e}.task{border:1px solid #dce4ef;padding:15px;border-radius:12px;margin:10px 0}.question{border-top:1px solid #e3eaf2;padding:15px 0}.preview{width:170px;max-height:140px;object-fit:contain;margin:6px;border-radius:8px}label{font-weight:650}small{color:#64758a}.pill{background:#e8f0fa;padding:5px 9px;border-radius:20px;font-size:12px}.break{overflow-wrap:anywhere}.task-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.task-actions button{margin:0}.view-title{margin:0 0 14px}.task-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.task-summary button{flex:none}@media(max-width:650px){.row{display:block}header{padding:16px}}
:root{--orange:#EE6F2D;--green:#008155;--red:#E21836;--ink:#20382e;--line:#dce8e0}body{color:var(--ink);background:#f5f8f5}header{background:var(--green);border-bottom:5px solid var(--orange);box-shadow:0 3px 0 var(--red);align-items:center}header strong{font-size:21px;letter-spacing:.04em}.card{box-shadow:0 4px 18px #00815512;border:1px solid #e1ebe4}h2,h3{color:var(--green)}button{background:var(--green);font-weight:650;transition:filter .15s}button:hover{filter:brightness(.93)}button.secondary{background:#fff3e9;color:#9b4319;border:1px solid #f3c9ae}button.danger{background:var(--red);color:#fff}#newTask,#enter,#saveTaskNow{background:var(--orange)}input:focus,textarea:focus,select:focus{outline:2px solid var(--green);outline-offset:1px}.task{border-color:var(--line);border-left:4px solid var(--orange)}.pill{background:#e4f3ed;color:var(--green)}.question{border-color:var(--line)}#adminTasks .task-actions [data-share]{background:var(--orange);color:#fff}#status{font-size:13px}input,textarea,select{border-color:#cadbd0}
.yesno-group{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}.yesno-btn{margin:0;min-height:54px;background:#fff;color:#3d5447;border:2px solid #d8e4db;border-radius:12px;font-size:17px;font-weight:700}.yesno-btn.yes.is-selected{background:#e6f5ee;border-color:#008155;color:#008155}.yesno-btn.no.is-selected{background:#fff0f2;border-color:#E21836;color:#E21836}.yesno-btn:disabled{cursor:not-allowed;opacity:.7}.yesno-btn:focus-visible{outline:3px solid #EE6F2D;outline-offset:2px}
.task-category{border:1px solid #dce8e0;border-radius:12px;padding:12px;margin:14px 0;background:#fff}.task-category>summary{cursor:pointer;font-weight:750;color:#008155;padding:8px}.task-category .task{margin:12px 0}
.image-trigger{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--green);padding:0;border:0;cursor:zoom-in;vertical-align:middle}.image-trigger:hover{filter:brightness(.9)}.image-trigger:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.image-trigger.photo-link{padding:6px 2px;text-decoration:underline}.image-trigger .preview{margin:6px}.lightbox-open{overflow:hidden}#imageLightbox[hidden]{display:none!important}#imageLightbox{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:64px 18px 22px}#lightboxImage{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 10px 36px #0008}#lightboxClose{position:absolute;top:14px;right:18px;background:#fff;color:#182b22;border-radius:999px;width:44px;height:44px;padding:0;font-size:27px;line-height:1;z-index:1}

.store-task-card{cursor:pointer;transition:box-shadow .15s,transform .15s}.store-task-card:hover{box-shadow:0 7px 22px #00815522;transform:translateY(-1px)}.store-task-card:focus-visible{outline:3px solid var(--orange);outline-offset:3px}.store-task-card h3{margin:0 0 8px}.store-task-card p:last-child{margin-bottom:0}

.header-tools{display:flex;align-items:center;gap:10px;flex-shrink:0}.header-switch{font-size:12px;padding:5px 9px;margin:0;background:transparent;color:#fff;border:1px solid #ffffff80;border-radius:7px;font-weight:500}.header-switch:hover{background:#ffffff20}.admin-filter{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:14px 0}.admin-filter label{width:100%}.admin-filter input{width:min(240px,100%);margin:0}.admin-filter button{margin:0}.header-tools #status{white-space:nowrap}

/* V19 管理端桌機側欄與任務操作選單 */
.admin-layout{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}.admin-content{min-width:0}.admin-sidebar{position:sticky;top:22px;background:#fff;border:1px solid #e1ebe4;border-radius:16px;padding:16px;box-shadow:0 4px 18px #00815512}.sidebar-heading{font-size:13px;font-weight:750;color:#718578;margin:4px 10px 12px}.sidebar-link{display:block;width:100%;text-align:left;padding:13px 14px;margin:3px 0;background:transparent;color:#38594a;border-radius:10px}.sidebar-link:hover{background:#edf6f1}.sidebar-link.active{background:#e2f3ea;color:#008155}.admin-content .card{margin-bottom:18px}
#adminTasks .task{position:relative;border-left:1px solid var(--line);padding:15px 16px}#adminTasks .task-summary{flex:1;min-width:0}#adminTasks .task-actions{display:block;margin:0;position:relative;flex:none}#adminTasks .task{display:flex;gap:12px;align-items:center;justify-content:space-between}#adminTasks .task-summary>div{min-width:0}#adminTasks .task-summary strong{overflow-wrap:anywhere}#adminTasks .task-summary p{margin:7px 0 0}#adminTasks .task-menu-toggle{margin:0;background:#f1f6f2;color:#38594a;border:1px solid #dce8e0;border-radius:10px;min-width:40px;min-height:40px;font-size:22px;line-height:1}#adminTasks .task-menu{position:absolute;right:0;top:calc(100% + 5px);z-index:30;min-width:170px;padding:7px;background:white;border:1px solid #dce8e0;border-radius:12px;box-shadow:0 12px 32px #183b2a24;display:flex;flex-direction:column;gap:2px}#adminTasks .task-menu[hidden]{display:none}#adminTasks .task-menu button{width:100%;text-align:left;padding:10px 12px;margin:0;border:0;background:transparent;color:#244536;font-size:14px;font-weight:550;border-radius:7px}#adminTasks .task-menu button:hover{background:#edf6f1}#adminTasks .task-menu button.danger{color:#c62b42}#adminTasks .task-menu button.danger:hover{background:#fff0f2}
@media(min-width:900px){main:has(#adminPage:not(.hidden)){max-width:1380px;padding:0 28px}.admin-layout{grid-template-columns:235px minmax(0,1fr)}}
@media(max-width:760px){.admin-layout{display:block}.admin-sidebar{position:static;display:flex;gap:8px;padding:9px;margin-bottom:15px}.sidebar-heading{display:none}.sidebar-link{flex:1;text-align:center;margin:0;padding:11px 6px;font-size:14px}#adminTasks .task{align-items:flex-start}#adminTasks .task-summary{align-items:flex-start}.admin-content .card{padding:17px}#adminTasks .task-menu{right:0}}

.store-picker{border:0;border-radius:18px;width:min(560px,calc(100vw - 28px));max-height:85vh;padding:22px;box-shadow:0 20px 70px #001a1044}.store-picker::backdrop{background:#102b20a6}.picker-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.picker-head h2{margin:0}.picker-options{max-height:44vh;overflow:auto;display:grid;gap:7px}.picker-option{width:100%;text-align:left;background:#f4faf6;color:#214c38;border:1px solid #d6e9dc;margin:0;padding:12px}.picker-option:disabled{opacity:.5;cursor:default}.picker-option:hover:not(:disabled){background:#e3f4ea}.store-detail{font-size:13px;color:#64758a;margin-top:5px}
</style></head><body><header><strong>區組回饋平台</strong><div class="header-tools"><button id="storeLogout" class="header-switch hidden" type="button">切換門市</button><button id="adminLogout" class="header-switch hidden" type="button">登出</button><span id="status">連線中</span></div></header><main><section id="login" class="card"><h2>門市登入</h2><p class="muted">輸入您所屬的門市名稱或店號</p><form id="storeLoginForm"><input id="storeName" placeholder="例如 嘉城 或 123456" autocomplete="organization" required><p id="sharedTaskHint" class="muted"></p><button id="enter" type="submit">進入門市</button></form><p id="loginError" class="error"></p></section><section id="storePage" class="hidden"><div class="card row"><h2 id="storeTitle"></h2><button id="storeBack" type="button" class="secondary hidden">返回列表</button></div><div class="card"><label for="storeSort">任務排序</label><select id="storeSort"><option value="date">任務日期 新到舊</option><option value="deadline">截止日期 最近到最遠</option></select></div><div id="tasks"></div><div id="response" class="card hidden"></div></section><section id="adminLogin" class="card hidden"><h2>管理者登入</h2><form id="adminLoginForm"><input id="email" type="email" placeholder="管理者 Email" autocomplete="username" required><input id="password" type="password" placeholder="Firebase 密碼"><button id="adminSignIn" type="submit">登入</button></form><button id="quickAdminLogin" type="button" class="secondary">快速登入（已登入過的裝置）</button><button id="backLogin" class="secondary">返回</button><p class="muted">管理者以 Firebase 帳號登入</p><p id="adminError" class="error"></p></section><section id="adminPage" class="hidden"><div class="admin-layout"><nav class="admin-sidebar" aria-label="管理功能"><div class="sidebar-heading">管理功能</div><button type="button" class="sidebar-link active" id="navTasks">▦　任務管理</button><button type="button" class="sidebar-link" id="navStores">▤　門市管理</button></nav><div class="admin-content"><div id="adminTaskList" class="card"><div class="row"><h2>任務管理</h2><button id="newTask">新增任務</button></div><div class="admin-filter"><label for="adminDate">任務日期篩選</label><input id="adminDate" type="date"><button id="clearAdminDate" type="button" class="secondary">顯示全部日期</button></div><label for="adminSort">任務排序</label><select id="adminSort"><option value="date">任務日期 新到舊</option><option value="deadline">截止日期 最近到最遠</option></select><div id="adminTasks"></div></div><div id="editor" class="card hidden"><div class="row"><h2>編輯任務</h2><button id="backAdminTasks" class="secondary">返回任務管理</button></div><label>任務名稱</label><input id="taskTitle" required><label>任務時間</label><input id="taskTime" type="date" required><label>任務說明</label><textarea id="taskDesc" required></textarea><label>截止日期</label><input id="taskDeadline" type="datetime-local" required><label for="taskStatus">任務狀態</label><select id="taskStatus"><option value="draft">暫存（僅管理者可見）</option><option value="published">發布（門市可見）</option></select><label>指定門市</label><div id="taskStoreOptions"></div><p class="muted">未勾選表示所有門市</p><label>參考範例照片</label><input id="reference" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="referenceList"></div><h3>回饋題目 <small>至少一題且題目名稱必填</small></h3><div id="questionEditor"></div><button id="addQuestion">新增題目</button><p id="editorStatus" class="muted"></p><button id="saveTaskNow">儲存任務</button></div><div id="adminStores" class="card hidden"><h2>門市管理</h2><div class="row"><button id="addStore" type="button">＋ 從門市名冊新增</button></div><div id="storeList"></div><p id="storeMessage" class="muted"></p></div><div id="taskFeedback" class="card hidden"><div class="row"><h2 id="feedbackTitle">任務回饋</h2><button id="backFromFeedback" class="secondary">返回任務管理</button></div><div id="overview"></div></div></div></div></section></main><dialog id="duplicateStorePicker" class="store-picker"><div class="picker-head"><h2>確認所屬區課</h2><button id="closeDuplicateStorePicker" type="button" class="secondary">關閉</button></div><p class="muted">找到多間名稱為「<strong id="duplicateStoreName"></strong>」的門市，請選擇您所屬的區課及店號</p><div id="duplicateStoreOptions" class="picker-options"></div><p id="duplicateStoreError" class="error"></p></dialog><dialog id="storePicker" class="store-picker"><div class="picker-head"><h2>新增門市</h2><button id="closeStorePicker" type="button" class="secondary">關閉</button></div><label for="pickerArea">選擇區課</label><select id="pickerArea"><option value="">請選擇區課</option></select><label for="pickerSearch">選擇門市名稱（店號）</label><input id="pickerSearch" placeholder="搜尋門市或店號" autocomplete="off"><div id="pickerOptions" class="picker-options"></div><p id="pickerMessage" class="error"></p></dialog><div id="imageLightbox" role="dialog" aria-modal="true" aria-label="照片放大預覽" hidden><button id="lightboxClose" type="button" aria-label="關閉照片">×</button><img id="lightboxImage" alt="放大照片"></div><script>const t=new URLSearchParams(location.search).get('task');if(t)document.getElementById('sharedTaskHint').textContent='已收到指定任務連結，輸入門市名稱後將直接開啟任務';</script><script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script><script type="module" src="./app.js?build=20261104-23"></script></body></html>
