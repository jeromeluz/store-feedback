<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>區組回饋平台</title><style>:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#19314c;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#193c66;color:white;padding:18px max(18px,calc((100% - 1100px)/2));display:flex;justify-content:space-between;gap:12px}main{max-width:1100px;margin:28px auto;padding:0 16px}.card{background:#fff;border-radius:16px;padding:22px;margin:0 0 18px;box-shadow:0 4px 18px #1232}h2{margin-top:0}input,textarea,select,button{font:inherit;border-radius:8px;padding:10px;border:1px solid #cdd7e4}input,textarea,select{display:block;width:100%;margin:7px 0 15px}textarea{min-height:90px}button{background:#225c99;color:white;border:0;cursor:pointer;margin:4px 6px 4px 0}button.secondary{background:#e6edf5;color:#163a61}button.danger{background:#a42b39}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.muted{color:#64758a;font-size:14px}.error{color:#b3261e}.task{border:1px solid #dce4ef;padding:15px;border-radius:12px;margin:10px 0}.question{border-top:1px solid #e3eaf2;padding:15px 0}.preview{width:170px;max-height:140px;object-fit:contain;margin:6px;border-radius:8px}label{font-weight:650}small{color:#64758a}.pill{background:#e8f0fa;padding:5px 9px;border-radius:20px;font-size:12px}.break{overflow-wrap:anywhere}.task-actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.task-actions button{margin:0}.view-title{margin:0 0 14px}.task-summary{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.task-summary button{flex:none}@media(max-width:650px){.row{display:block}header{padding:16px}}
:root{--orange:#EE6F2D;--green:#008155;--red:#E21836;--ink:#20382e;--line:#dce8e0}body{color:var(--ink);background:#f5f8f5}header{background:var(--green);border-bottom:5px solid var(--orange);box-shadow:0 3px 0 var(--red);align-items:center}header strong{font-size:21px;letter-spacing:.04em}.card{box-shadow:0 4px 18px #00815512;border:1px solid #e1ebe4}h2,h3{color:var(--green)}button{background:var(--green);font-weight:650;transition:filter .15s}button:hover{filter:brightness(.93)}button.secondary{background:#fff3e9;color:#9b4319;border:1px solid #f3c9ae}button.danger{background:var(--red);color:#fff}#newTask,#enter,#saveTaskNow{background:var(--orange)}input:focus,textarea:focus,select:focus{outline:2px solid var(--green);outline-offset:1px}.task{border-color:var(--line);border-left:4px solid var(--orange)}.pill{background:#e4f3ed;color:var(--green)}.question{border-color:var(--line)}#adminTasks .task-actions [data-share]{background:var(--orange);color:#fff}#status{font-size:13px}input,textarea,select{border-color:#cadbd0}
</style></head><body><header><strong>區組回饋平台</strong><span id="status">連線中</span></header><main><section id="login" class="card"><h2>門市登入</h2><p class="muted">輸入管理者建立的門市名稱</p><input id="storeName" placeholder="例如 嘉義中山店"><p id="sharedTaskHint" class="muted"></p><button id="enter">進入門市</button><button id="adminEntry" class="secondary">管理者模式</button><p id="loginError" class="error"></p></section><section id="storePage" class="hidden"><div class="card row"><h2 id="storeTitle"></h2><button id="storeLogout" class="secondary">切換門市</button></div><div class="card"><label for="storeSort">任務排序</label><select id="storeSort"><option value="date">任務日期 新到舊</option><option value="deadline">截止日期 最近到最遠</option></select></div><div id="tasks"></div><div id="response" class="card hidden"></div></section><section id="adminLogin" class="card hidden"><h2>管理者登入</h2><input id="email" type="email" placeholder="管理者 Email"><input id="password" type="password" placeholder="Firebase 密碼"><button id="adminSignIn">登入</button><button id="backLogin" class="secondary">返回</button><p class="muted">管理者以 Firebase 帳號登入</p><p id="adminError" class="error"></p></section><section id="adminPage" class="hidden"><div id="adminTaskList" class="card"><div class="row"><h2>任務管理</h2><button id="newTask">新增任務</button><button id="adminLogout" class="secondary">登出</button></div><label for="adminSort">任務排序</label><select id="adminSort"><option value="date">任務日期 新到舊</option><option value="deadline">截止日期 最近到最遠</option></select><div id="adminTasks"></div></div><div id="editor" class="card hidden"><div class="row"><h2>編輯任務</h2><button id="backAdminTasks" class="secondary">返回任務管理</button></div><label>任務名稱</label><input id="taskTitle" required><label>任務時間</label><input id="taskTime" type="date" required><label>任務說明</label><textarea id="taskDesc" required></textarea><label>截止日期</label><input id="taskDeadline" type="datetime-local" required><label>指定門市</label><div id="taskStoreOptions"></div><p class="muted">未勾選表示所有門市</p><label>參考範例照片</label><input id="reference" type="file" accept="image/jpeg,image/png,image/webp" multiple><div id="referenceList"></div><h3>回饋題目 <small>至少一題且題目名稱必填</small></h3><div id="questionEditor"></div><button id="addQuestion">新增題目</button><p id="editorStatus" class="muted"></p><button id="saveTaskNow">儲存任務</button></div><div id="adminStores" class="card"><h2>門市管理</h2><div class="row"><input id="newStoreName" placeholder="門市名稱"><button id="addStore">新增門市</button></div><div id="storeList"></div><p id="storeMessage" class="muted"></p></div><div id="taskFeedback" class="card hidden"><div class="row"><h2 id="feedbackTitle">任務回饋</h2><button id="backFromFeedback" class="secondary">返回任務管理</button></div><div id="overview"></div></div></section></main><script>const t=new URLSearchParams(location.search).get('task');if(t)document.getElementById('sharedTaskHint').textContent='已收到指定任務連結，輸入門市名稱後將直接開啟任務';</script><script type="module" src="./app.js"></script></body></html>
